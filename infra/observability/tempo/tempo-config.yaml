stream_over_http_enabled: true

server:
  http_listen_port: ${TEMPO_PORT:-3200}

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:${TEMPO_OTLP_GRPC_PORT:-4317}"
        http:
          endpoint: "0.0.0.0:${TEMPO_OTLP_HTTP_PORT:-4318}"

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
