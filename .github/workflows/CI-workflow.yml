name: CI workflow

on:
    push:
      branches: ['fix/CI-workflow']
    pull_request:
      branches: ['dev', 'main']

jobs:
    frontend:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v3

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'pnpm'

            - name: Install deps
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint:frontend

            - name: Lint FSD
              run: pnpm lint:fsd:frontend

            - name: Format
              run: pnpm format:check

            - name: Typecheck
              run: pnpm typecheck:frontend

            #      - name: Unit tests
            #        run: pnpm test:frontend:ci

            - name: Build
              run: pnpm build:frontend

      #      - name: Build Storybook
      #        run: pnpm build-storybook

    backend:
      runs-on: ubuntu-latest

      services:
        postgres:
          image: postgres:16
          env:
            POSTGRES_DB: test
            POSTGRES_USER: test
            POSTGRES_PASSWORD: test
          ports:
            - 5432:5432
          options: >-
            --health-cmd="pg_isready"
            --health-interval=10s
            --health-timeout=5s
            --health-retries=5

      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test
        PORT: 3000
        JWT_SECRET: test
        JWT_EXPIRES_IN: 7d
        NODE_ENV: test

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup pnpm
          uses: pnpm/action-setup@v3

        - name: Setup Node
          uses: actions/setup-node@v4
          with:
            node-version: 222
            cache: 'pnpm'

        - name: Install deps
          run: pnpm install --frozen-lockfile

        - name: Prisma generate
          run: pnpm prisma:generate:backend

        - name: Apply migrations (test DB)
          run: pnpm prisma:migrate:deploy:backend

        - name: Lint
          run: pnpm lint:backend

        - name: Format
          run: pnpm format:check

        - name: Typecheck
          run: pnpm typecheck:backend

        - name: Unit tests
          run: pnpm test:backend:ci

        - name: Build
          run: pnpm build:backend
