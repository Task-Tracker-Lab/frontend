name: Frontend CI

on:
  pull_request:
    branches: ['dev', 'main', 'features/ci-workflow']
    paths:
      - 'frontend/**'

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

#      - name: Unit tests
#        run: pnpm test --run

      - name: Build
        run: pnpm build

#      - name: Build Storybook
#        run: pnpm build-storybook