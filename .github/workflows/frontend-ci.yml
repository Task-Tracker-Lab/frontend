name: Frontend CI

on:
    push:
      branches: [ 'dev', 'main', 'feature/CI-workflow' ]
      paths:
        - 'apps/frontend/**'

    pull_request:
      branches: ['dev', 'main', 'features/CI-workflow']
      paths:
          - 'apps/frontend/**'

jobs:
    frontend:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v3
              with:
                  version: 9

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'pnpm'

            - name: Install deps
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint:frontend

            - name: Lint FSD
              run: pnpm lint:fsd:frontend

            - name: Format
              run: pnpm format:check

            - name: Typecheck
              run: pnpm type-check:frontend

            #      - name: Unit tests
            #        run: pnpm test:frontend:ci

            - name: Build
              run: pnpm build:frontend

      #      - name: Build Storybook
      #        run: pnpm build-storybook
